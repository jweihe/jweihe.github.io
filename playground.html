<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground</title>
  <meta name="description" content="Small interactive sketches and experiments.">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Modao</a>
    <nav aria-label="Site navigation">
      <a href="about.html">About</a>
      <a href="publications.html">Publications</a>
      <a href="projects.html">Projects</a>
      <a href="playground.html">Playground</a>
      <a href="blog.html">Writing</a>
      <a href="notes.html">Notes</a>
    </nav>
  </header>

  <main class="page playground-page">
    <header class="page-header">
      <p class="kicker">Playground</p>
      <h1>Small Strange Things</h1>
      <p>Interactive sketches, visual toys, and small experiments.</p>
    </header>

    <section class="toy-box" aria-labelledby="tether-title">
      <div class="toy-copy">
        <p class="kicker">Physics Sketch</p>
        <h2 id="tether-title">Tether Drop</h2>
        <p>Drag the weight, release, then cut the tether.</p>
      </div>

      <div class="toy-stage">
        <canvas id="tetherCanvas" width="960" height="560" aria-label="Interactive tether physics sketch"></canvas>
      </div>

      <div class="toy-controls">
        <label>
          <span>Gravity</span>
          <input id="gravityControl" type="range" min="20" max="160" value="78">
        </label>
        <label>
          <span>Tether</span>
          <input id="tetherControl" type="range" min="110" max="260" value="180">
        </label>
        <div class="toy-actions">
          <button id="cutTether" type="button">Cut</button>
          <button id="resetToy" type="button">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© Modao</span>
    <a href="projects.html">Projects</a>
  </footer>

  <script>
    const canvas = document.querySelector("#tetherCanvas");
    const ctx = canvas.getContext("2d");
    const gravityControl = document.querySelector("#gravityControl");
    const tetherControl = document.querySelector("#tetherControl");
    const cutTether = document.querySelector("#cutTether");
    const resetToy = document.querySelector("#resetToy");
    const pointer = { active: false, x: 0, y: 0, id: null };
    const target = { x: 0, y: 0, radius: 26, pulse: 0 };
    const sparks = [];
    let weight = { x: 0, y: 0, vx: 0, vy: 0, radius: 22 };
    let anchor = { x: 0, y: 0 };
    let tethered = true;
    let width = 0;
    let height = 0;
    let dpr = 1;
    let lastTime = performance.now();

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(320, rect.width);
      height = Math.max(280, rect.height);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function reset() {
      resizeCanvas();
      anchor = { x: width * 0.46, y: height * 0.16 };
      weight = { x: anchor.x + Number(tetherControl.value) * 0.48, y: anchor.y + Number(tetherControl.value) * 0.74, vx: -1.8, vy: 0, radius: 22 };
      target.x = width * 0.74;
      target.y = height * 0.72;
      target.pulse = 0;
      sparks.length = 0;
      tethered = true;
      lastTime = performance.now();
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (width / rect.width),
        y: (event.clientY - rect.top) * (height / rect.height)
      };
    }

    function keepOnTether() {
      const length = Number(tetherControl.value);
      const dx = weight.x - anchor.x;
      const dy = weight.y - anchor.y;
      const distance = Math.max(1, Math.hypot(dx, dy));
      const nx = dx / distance;
      const ny = dy / distance;
      weight.x = anchor.x + nx * length;
      weight.y = anchor.y + ny * length;
      const radialVelocity = weight.vx * nx + weight.vy * ny;
      weight.vx -= radialVelocity * nx;
      weight.vy -= radialVelocity * ny;
    }

    function burst(x, y) {
      target.pulse = 1;
      for (let i = 0; i < 24; i += 1) {
        const angle = (Math.PI * 2 * i) / 24;
        sparks.push({
          x,
          y,
          vx: Math.cos(angle) * (1.8 + Math.random() * 1.8),
          vy: Math.sin(angle) * (1.8 + Math.random() * 1.8),
          life: 1
        });
      }
    }

    function drawTarget() {
      const pulse = target.pulse * 12;
      ctx.save();
      ctx.translate(target.x, target.y);
      ctx.strokeStyle = "rgba(111, 73, 56, 0.34)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, target.radius + pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(111, 73, 56, 0.11)";
      ctx.beginPath();
      ctx.arc(0, 0, target.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6f4938";
      ctx.beginPath();
      for (let i = 0; i < 5; i += 1) {
        const outer = -Math.PI / 2 + i * (Math.PI * 2 / 5);
        const inner = outer + Math.PI / 5;
        ctx.lineTo(Math.cos(outer) * 16, Math.sin(outer) * 16);
        ctx.lineTo(Math.cos(inner) * 7, Math.sin(inner) * 7);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawSparks(delta) {
      for (let i = sparks.length - 1; i >= 0; i -= 1) {
        const spark = sparks[i];
        spark.life -= delta * 1.8;
        spark.x += spark.vx * delta * 60;
        spark.y += spark.vy * delta * 60;
        if (spark.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = spark.life;
        ctx.fillStyle = "#6f4938";
        ctx.beginPath();
        ctx.arc(spark.x, spark.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function step() {
      const now = performance.now();
      const delta = Math.min(0.032, (now - lastTime) / 1000);
      lastTime = now;
      const gravity = Number(gravityControl.value) * 5.4;

      ctx.fillStyle = "rgba(251, 248, 239, 0.82)";
      ctx.fillRect(0, 0, width, height);

      if (pointer.active) {
        const dx = pointer.x - weight.x;
        const dy = pointer.y - weight.y;
        weight.vx += dx * 0.12;
        weight.vy += dy * 0.12;
      }

      weight.vy += gravity * delta;
      weight.x += weight.vx * delta * 60;
      weight.y += weight.vy * delta * 60;
      weight.vx *= 0.992;
      weight.vy *= 0.992;
      if (tethered) keepOnTether();

      if (weight.x < weight.radius || weight.x > width - weight.radius) {
        weight.vx *= -0.76;
        weight.x = Math.max(weight.radius, Math.min(width - weight.radius, weight.x));
      }
      if (weight.y < weight.radius || weight.y > height - weight.radius) {
        weight.vy *= -0.76;
        weight.y = Math.max(weight.radius, Math.min(height - weight.radius, weight.y));
      }

      const hit = Math.hypot(weight.x - target.x, weight.y - target.y) < weight.radius + target.radius;
      if (hit && target.pulse <= 0.05) burst(target.x, target.y);
      target.pulse = Math.max(0, target.pulse - delta * 1.8);

      drawTarget();
      drawSparks(delta);

      if (tethered) {
        ctx.strokeStyle = "#6f4938";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(anchor.x, anchor.y);
        ctx.lineTo(weight.x, weight.y);
        ctx.stroke();
      }

      ctx.fillStyle = "#25211d";
      ctx.beginPath();
      ctx.arc(anchor.x, anchor.y, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = "rgba(111, 73, 56, 0.2)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#6f4938";
      ctx.beginPath();
      ctx.arc(weight.x, weight.y, weight.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(251, 248, 239, 0.62)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(weight.x - 6, weight.y - 7, weight.radius * 0.32, 0, Math.PI * 2);
      ctx.stroke();

      requestAnimationFrame(step);
    }

    canvas.addEventListener("pointerdown", (event) => {
      const point = canvasPoint(event);
      pointer.active = true;
      pointer.id = event.pointerId;
      pointer.x = point.x;
      pointer.y = point.y;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!pointer.active) return;
      const point = canvasPoint(event);
      pointer.x = point.x;
      pointer.y = point.y;
    });
    canvas.addEventListener("pointerup", () => {
      pointer.active = false;
      pointer.id = null;
    });
    canvas.addEventListener("pointercancel", () => {
      pointer.active = false;
      pointer.id = null;
    });
    cutTether.addEventListener("click", () => {
      tethered = false;
    });
    resetToy.addEventListener("click", reset);
    tetherControl.addEventListener("input", () => {
      if (tethered) keepOnTether();
    });
    window.addEventListener("resize", reset);

    reset();
    step();
  </script>
</body>
</html>
